# Configuration of GOAT_PD_Stand task PPO RL

## ---------------- Agent ---------------- ## 
agent:
  # class: PPO
  rollouts: 16
  learning_epochs: 4
  mini_batches: 4 
  discount_factor: 0.995
  lambda_coeff: 0.95
  learning_rate: 2.0e-04

  # state_preprocessor: RunningStandardScaler
  # state_preprocessor_kwargs: {}
  # value_preprocessor: RunningStandardScaler
  # value_preprocessor_kwargs: {}

  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.004

  random_timesteps: 0
  learning_starts: 0

  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2

  entropy_loss_scale: 0.035
  value_loss_scale: 2.0
  kl_threshold: 0.0
  time_limit_bootstrap: True

  # logging and checkpoint
  experiment:
    directory: "PD_stand_result"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

## ---------------- Model ---------------- ##
model:
  actor:
    clip_actions: False
    clip_log_std: True
    min_log_std: -2.0
    max_log_std: 0.0
    reduction: "sum"
  
  critic:
    clip_actions: False

## ---------------- Trainer ---------------- ##
trainer:
  close_environment_at_exit: False
  timesteps: 100000
  headless: True
  disable_progressbar: False
  close_environment_at_exit: True
  environment_info: "episode"
  stochastic_evaluation: False